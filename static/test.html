<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click 测试页面</title>
    <link rel="stylesheet" href="click.css">
    <style>
    .click-button {
        border-color: #ff8e2d;
        color: #ff8e2d;
    }
    .click-button:hover:not([aria-disabled="true"]) {
        background: #ff8e2d;
        color: white;
    }
    </style>
</head>
<body>
    <h1>Click 点赞按钮测试</h1>
    <p>这是一个测试页面，用于验证点赞功能。</p>
    <button class="click-button" data-slug="/test-page" aria-hidden="true">👍 点赞</button>
    <button class="click-button" data-slug="/like" aria-hidden="true">喜欢</button>
    <button class="click-button" data-slug="/dislike" aria-hidden="true">不喜欢</button>
    <script src="click.js"></script>
</body>
</html>
