<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click 测试页面</title>
    <link rel="stylesheet" href="click.css">
    <style>
    .buttons {
        display: flex;
        justify-content: space-between;
        margin: 20px 0;
    }
    </style>
</head>
<body>
    <h1>Click 点赞按钮测试</h1>
    <p>这是一个测试页面，用于验证点赞功能。</p>
    <div class="buttons">
        <button class="click-button" data-slug="/test-page" data-icon="❤️">点赞</button>
        <button class="click-button" data-slug="/like" data-icon="👍">喜欢</button>
        <button class="click-button" data-slug="/dislike" data-icon="👎">不喜欢</button>
    </div>
    <script src="click.js"></script>
</body>
</html>
