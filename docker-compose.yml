version: '3.8'

services:
  app:
    image: ghcr.io/bboysoulcn/click:latest
    container_name: click-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://click:click_password@db:5432/click
      - ALLOWED_ORIGINS=http://127.0.0.1:8000,http://localhost:8000,https://yourdomain.com,https://www.bboy.app
      - DEBUG=False
      - RATE_LIMIT_REQUESTS=60
      - RATE_LIMIT_WINDOW=3600
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: click-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=click
      - POSTGRES_PASSWORD=click_password
      - POSTGRES_DB=click
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U click"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
