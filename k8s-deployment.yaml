apiVersion: apps/v1
kind: Deployment
metadata:
  name: click
  namespace: click
spec:
  replicas: 1
  selector:
    matchLabels:
      app: click
  template:
    metadata:
      labels:
        app: click
    spec:
      containers:
      - name: click
        image: ghcr.io/bboysoulcn/click:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://click:click@click-db:5432/click"
        - name: ALLOWED_ORIGINS
          value: "http://localhost:3000"
        - name: RATE_LIMIT_REQUESTS
          value: "100"
        - name: RATE_LIMIT_WINDOW
          value: "60"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        readinessProbe:
          httpGet:
            path: /api/status
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/status
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: click
  namespace: click
spec:
  selector:
    app: click
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: click-ingress
  namespace: click
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: your-click-domain.com  # 替换为你的域名
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: click
            port:
              number: 80